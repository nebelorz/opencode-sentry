<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenCode Go</title>
  </head>
  <body>
    <main>
      <h1>OpenCode Go</h1>

      <h2 id="usage-limits">Usage limits</h2>
      <div data-plan-tabs>
        <div data-plan-panel="go">
          <table>
            <thead>
              <tr>
                <th>Model</th>
                <th>Input</th>
                <th>Output</th>
                <th>Cached Read</th>
                <th>Cached Write</th>
                <th>Monthly limit</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Kimi K2.5</td>
                <td>$0.95</td>
                <td>$4.00</td>
                <td>$0.16</td>
                <td>-</td>
                <td>$60</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div data-plan-panel="go-plus">
          <table>
            <thead>
              <tr>
                <th>Model</th>
                <th>Output</th>
                <th>Cached Read</th>
                <th>Cached Write</th>
                <th>Monthly limit</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Kimi K2.5</td>
                <td>$4.00</td>
                <td>$0.16</td>
                <td>-</td>
                <td>$180</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </body>
</html>
